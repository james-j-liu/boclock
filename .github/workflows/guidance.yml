name: Code forward guidance (backfill)

# Codes Council and member documents for the decision they signal at the next
# announcement (scripts/code_guidance.py) and commits data/processed/guidance_codes.json
# back to the branch. The daily run codes new documents itself; this is for the
# one-off backfill and for re-coding after a prompt change.
on:
  workflow_dispatch: {}
  push:
    branches: ["claude/**"]
    paths:
      - "src/boclock/forecast/guidance.py"
      - "scripts/code_guidance.py"
      - ".github/workflows/guidance.yml"

permissions:
  contents: write

concurrency:
  group: guidance-${{ github.ref }}
  cancel-in-progress: false

jobs:
  code:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Code documents
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python -u scripts/code_guidance.py --since 2016-01-01
      - name: Commit codes
        run: |
          git config user.name "boclock-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/processed/guidance_codes.json
          git commit -m "code forward guidance $(date -u +%F)" || echo "nothing new"
          git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}"
